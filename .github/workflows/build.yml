name: VHS6RIFT Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project structure and parameter registration
        shell: pwsh
        run: |
          python tools/validate_project.py --static-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_source_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_vhs6rift.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Adobe SDK and PiPLtool
        shell: pwsh
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE 'extern\AfterEffectsSDK'
          if (-not (Test-Path (Join-Path $sdk 'Headers\AE_Effect.h')) -and -not (Test-Path (Join-Path $sdk 'Examples\Headers\AE_Effect.h'))) {
            throw "Adobe AE SDK headers are missing under extern/AfterEffectsSDK. Add your licensed SDK using the folder layout in README.md."
          }
          $tools = @(
            (Join-Path $sdk 'Resources\PiPLtool.exe'),
            (Join-Path $sdk 'Examples\Resources\PiPLtool.exe')
          )
          if (-not ($tools | Where-Object { Test-Path $_ })) {
            throw "PiPLtool.exe is missing. Expected Resources/PiPLtool.exe or Examples/Resources/PiPLtool.exe under extern/AfterEffectsSDK."
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE 'extern\AfterEffectsSDK'
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 "-DAE_SDK_ROOT=$sdk" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release AEX
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native C++ pixel-pipeline tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem build -Recurse -Filter 'VHS6RIFT_NativeTests.exe')
          if ($tests.Count -ne 1) { throw "Expected exactly one native test executable, found $($tests.Count)." }
          $output = & $tests[0].FullName 2>&1 | Tee-Object -FilePath native-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Native C++ tests failed with exit code $LASTEXITCODE." }
          $summary = [regex]::Match(($output -join "`n"), 'Summary:\s+(\d+)\s+/\s+(\d+) native C\+\+ tests PASSED')
          if (-not $summary.Success) { throw "Native C++ test suite did not print its pass summary." }
          if ($summary.Groups[1].Value -ne $summary.Groups[2].Value) { throw "Native C++ tests failed: $($summary.Groups[1].Value) / $($summary.Groups[2].Value) passed." }

      - name: Verify and collect exactly one AEX
        shell: pwsh
        run: |
          $files = @(Get-ChildItem build -Recurse -Filter 'VHS6RIFT.aex')
          if ($files.Count -ne 1) { throw "Expected exactly one VHS6RIFT.aex, found $($files.Count)." }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $files[0].FullName artifacts\VHS6RIFT.aex
          Get-FileHash artifacts\VHS6RIFT.aex -Algorithm SHA256 | Format-List | Out-File artifacts\SHA256.txt

      - name: Upload AEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: VHS6RIFT-aex
          path: artifacts/*
          if-no-files-found: error

      - name: Upload configure/build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VHS6RIFT-build-logs
          path: |
            configure.log
            build.log
            native-tests.log
          if-no-files-found: warn
