name: VHS6RIFT Windows Build & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Architecture & Parameter Validation
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project structure and parameter registration
        shell: pwsh
        run: python tools/validate_project.py

      - name: Audit parameter wiring and render-math connections
        shell: pwsh
        run: python tools/audit_parameter_wiring.py

      - name: Run 14-gate functional test suite
        shell: pwsh
        run: python tools/test_vhs6rift.py

      - name: Verify SDK discovery logic across simulated layouts
        shell: pwsh
        run: python tools/test_sdk_discovery.py

  build:
    name: Native Windows x64 AEX Build
    needs: [validate]
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VHS6RIFT target
        shell: pwsh
        run: cmake --build build --config Release --target VHS6RIFT --parallel

      - name: Verify and collect exactly one AEX
        shell: pwsh
        run: |
          $files = @(Get-ChildItem build -Recurse -Filter "VHS6RIFT.aex" -File)
          if ($files.Count -ne 1) { throw "Expected exactly one VHS6RIFT.aex, found $($files.Count)." }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $files[0].FullName artifacts\VHS6RIFT.aex
          Get-FileHash artifacts\VHS6RIFT.aex -Algorithm SHA256 | Format-List | Out-File artifacts\SHA256.txt

      - name: Upload AEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: VHS6RIFT-aex
          path: artifacts/*
          if-no-files-found: error

      - name: Upload configure and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VHS6RIFT-build-logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore
